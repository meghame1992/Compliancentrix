name: Publish Approved Content from Notion

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Pull from Notion and generate pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/publish_from_notion.py
      - name: Commit and push
        run: |
          git config --global user.name "Compliancentrix Publisher"
          git config --global user.email "info@compliancentrix.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-publish $(date +'%Y-%m-%d')"
          git push
