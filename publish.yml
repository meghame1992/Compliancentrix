name: Publish Approved Content from Notion

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pull from Notion and generate pages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python scripts/publish_from_notion.py

      - name: Commit and push if content changed
        run: |
          git config --global user.name "Compliancentrix Publisher"
          git config --global user.email "info@compliancentrix.com"
          git add -A insights/ index_insights.html
          git diff --staged --quiet || git commit -m "Auto-publish $(date +'%Y-%m-%d')"
          git push
